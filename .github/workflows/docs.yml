name: Docs

# Builds the documentation site (Doxygen XML + Sphinx, warnings are errors).
#   pull request          build only; the HTML is uploaded as an artifact
#   push to main          build and deploy to gh-pages:/dev/
#   push of tag vX.Y.Z    build and deploy to gh-pages:/X.Y/ and, if X.Y is the newest
#                         release, to /stable/; switcher.json is updated
# Other directories on gh-pages are kept.

on:
  pull_request:
    paths:
      - "doc/**"
      - "include/**"
      - "CHANGELOG.md"
      - "README.md"
      - "CMakeLists.txt"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE_URL: https://nilesh-patil.github.io/simucell3d

jobs:
  build:
    name: Build HTML
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Determine the docs version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: doc/requirements.txt

      - name: Install Doxygen and the Sphinx toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen
          doxygen --version
          python -m pip install -r doc/requirements.txt

      - name: Doxygen XML
        working-directory: doc
        run: |
          make doxygen
          test -f _build/doxygen/xml/index.xml

      - name: Sphinx HTML (warnings are errors)
        working-directory: doc
        env:
          SIMUCELL3D_DOCS_VERSION: ${{ steps.version.outputs.version }}
          SIMUCELL3D_REQUIRE_DOXYGEN: "1"
        run: make html-strict

      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: doc/_build/html
          retention-days: 14

  deploy:
    name: Deploy to gh-pages
    needs: build
    if: github.event_name == 'push' && github.repository == 'nilesh-patil/simucell3d'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: src

      - uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: html

      - name: Check out gh-pages (create it if missing)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" gh-pages > /dev/null; then
            git clone --depth 1 --branch gh-pages "$remote" site
          else
            git init site
            git -C site checkout --orphan gh-pages
            git -C site remote add origin "$remote"
          fi

      - name: Copy the build and update switcher.json
        shell: bash
        run: |
          set -euo pipefail
          targets=$(python3 - <<'PY'
          import json, os, pathlib

          site = pathlib.Path("site")
          version = os.environ["VERSION"]
          url = os.environ["SITE_URL"]
          path = site / "switcher.json"
          seed = pathlib.Path("src/doc/_static/switcher.json")
          entries = json.loads((path if path.exists() else seed).read_text())

          def key(v):
              return tuple(int(x) for x in v.split("."))

          releases = {e["version"] for e in entries if e["version"] != "dev"}
          targets = [version]
          if version != "dev":
              releases.add(version)
              newest = max(releases, key=key)
              if version == newest:
                  targets.append("stable")
          else:
              newest = max(releases, key=key) if releases else None

          out = [{"name": "dev", "version": "dev", "url": f"{url}/dev/"}]
          for v in sorted(releases, key=key, reverse=True):
              if v == newest:
                  out.append({"name": f"{v} (stable)", "version": v,
                              "url": f"{url}/stable/", "preferred": True})
              else:
                  out.append({"name": v, "version": v, "url": f"{url}/{v}/"})
          path.write_text(json.dumps(out, indent=2) + "\n")
          print(" ".join(targets))
          PY
          )
          read -r -a target_dirs <<< "$targets"
          for dir in "${target_dirs[@]}"; do
            echo "Deploying ${VERSION} to /${dir}/"
            rm -rf "site/${dir}"
            mkdir -p "site/${dir}"
            cp -a html/. "site/${dir}/"
          done
          touch site/.nojekyll
          # The site root redirects to /stable/ once a release exists, else to /dev/.
          root="dev"
          if [ -d site/stable ]; then root="stable"; fi
          printf '<!DOCTYPE html>\n<meta charset="utf-8">\n<title>SimuCell3D documentation</title>\n<meta http-equiv="refresh" content="0; url=%s/">\n<link rel="canonical" href="%s/%s/">\n<a href="%s/">SimuCell3D documentation</a>\n' \
            "$root" "$SITE_URL" "$root" "$root" > site/index.html
          cat site/switcher.json

      - name: Commit and push
        shell: bash
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git commit -m "docs: deploy ${VERSION} from ${GITHUB_SHA::7}"
          git push origin gh-pages
