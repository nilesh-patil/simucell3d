<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fpack-dark-t fpack-dark-d" viewBox="0 0 720 380" width="720" height="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><!-- drawn for a transparent ground over the page background: #14181e --><title id="fpack-dark-t">Superposed cells and core packing against tissue size, growth benchmark</title><desc id="fpack-dark-d">Left: the share of cells that sit on top of another cell is zero or near zero up to about 4,000 cells and rises to 39 percent at 136,043 cells in 2.1.0; 1.0 with two crash fixes rises the same way while its runs last. Right: the summed cell volume in the core divided by the core volume passes 1, where cells must overlap, between about 2,000 and 13,000 cells depending on the run, and reaches 1.9.</desc>
