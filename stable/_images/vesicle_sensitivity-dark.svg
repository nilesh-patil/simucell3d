<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fsens-dark-t fsens-dark-d" viewBox="0 0 720 352" width="720" height="352" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><!-- drawn for a transparent ground over the page background: #14181e --><title id="fsens-dark-t">Vesicle readouts: parameter response against replicate noise, 2.1.0</title><desc id="fsens-dark-d">For each readout of the vesicle sweep in 2.1.0, the smallest change between two neighbouring epsilon values, divided by the replicate standard deviation. Sphericity (26) and contact-area fraction (13) are far above 2; mean pressure and volume over target volume are at about 2; the aspect ratios, the share of cells off both surfaces, layer number and neighbour count are below 2.</desc>
