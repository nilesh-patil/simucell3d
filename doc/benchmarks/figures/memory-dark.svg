<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fmem-dark-t fmem-dark-d" viewBox="0 0 720 380" width="720" height="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><!-- drawn for a transparent ground over the page background: #14181e --><title id="fmem-dark-t">Peak memory against peak cell count, growth benchmark</title><desc id="fmem-dark-d">Peak resident memory grows linearly with cell count: about 0.130 GiB per 1,000 cells in 2.1.0, 18.6 to 19.2 GiB at 143 to 149 thousand cells, and about 0.21 GiB per 1,000 cells in 1.0 with two crash fixes. Three intermediate builds leak memory and reach the machine's 61.6 GiB limit before 140 thousand cells.</desc>
