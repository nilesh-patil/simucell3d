<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fgrow-light-t fgrow-light-d" viewBox="0 0 720 400" width="720" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><!-- drawn for a transparent ground over the page background: #ffffff --><title id="fgrow-light-t">Cells against wall-clock time, growth benchmark, time step 2.5e-8 s</title><desc id="fgrow-light-d">On log axes from 36 seconds (0.01 hours) to 48 hours, three runs of 2.1.0 grow from about 220 to 240 cells to 142 to 149 thousand cells; three runs of 1.0 with two crash fixes follow a curve about twice as slow and stop with an error at 23, 25 and 42 thousand cells. Above 10,000 cells the 2.1.0 curves follow a power law with exponent 1.333 ± 0.010; the dashed line is the fit published with the paper, measured at a four times larger time step.</desc>
