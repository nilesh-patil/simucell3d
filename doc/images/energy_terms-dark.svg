<text x="272" y="133" font-size="13" font-weight="400" fill="#a7b1bc" text-anchor="middle" >neighbour</text>
<line x1="4" y1="252" x2="26" y2="252" stroke="#d0643c" stroke-width="3" stroke-linecap="round"/>
<text x="32" y="256.5" font-size="13" font-weight="400" fill="#a7b1bc" text-anchor="start" >apical (free surface)</text>
<line x1="176" y1="252" x2="198" y2="252" stroke="#4a86c5" stroke-width="3" stroke-linecap="round"/>
<text x="204" y="256.5" font-size="13" font-weight="400" fill="#a7b1bc" text-anchor="start" >lateral (contact)</text>
<circle cx="15" cy="287" r="10.5" fill="none" stroke="#ced6dd" stroke-width="1.4"/><text x="15" y="292" font-size="14" font-weight="700" fill="#ced6dd" text-anchor="middle" >1</text>
<text x="34" y="292" font-size="15" font-weight="600" fill="#ced6dd" text-anchor="start" >Volume and pressure</text>
<text x="34" y="310" font-size="13.5" font-weight="400" fill="#ced6dd" text-anchor="start" >K V (ln V/V<tspan dy="3.78" font-size="9.72">0</tspan><tspan dy="-3.78"> − 1)</tspan></text>
<text x="34" y="328" font-size="13.5" font-weight="400" fill="#ced6dd" text-anchor="start" >p = −K ln(V/V<tspan dy="3.78" font-size="9.72">0</tspan><tspan dy="-3.78">), at most p</tspan><tspan dy="3.78" font-size="9.72">max</tspan></text>
<text x="34" y="345" font-size="13" font-weight="400" fill="#a7b1bc" text-anchor="start" >pushes faces outward when compressed</text>
<text x="34" y="362" font-size="13" font-weight="400" fill="#a7b1bc" text-anchor="start" >(V &lt; V<tspan dy="3.64" font-size="9.36">0</tspan><tspan dy="-3.64">), pulls them inward when swollen</tspan></text>
<circle cx="15" cy="387" r="10.5" fill="none" stroke="#ced6dd" stroke-width="1.4"/><text x="15" y="392" font-size="14" font-weight="700" fill="#ced6dd" text-anchor="middle" >2</text>
<text x="34" y="392" font-size="15" font-weight="600" fill="#ced6dd" text-anchor="start" >Surface tension</text>
<text x="34" y="410" font-size="13.5" font-weight="400" fill="#ced6dd" text-anchor="start" >γ ∫ dS, γ set per face type</text>
<text x="34" y="427" font-size="13" font-weight="400" fill="#a7b1bc" text-anchor="start" >pulls nodes along the surface</text>
<circle cx="15" cy="452" r="10.5" fill="none" stroke="#ced6dd" stroke-width="1.4"/><text x="15" y="457" font-size="14" font-weight="700" fill="#ced6dd" text-anchor="middle" >3</text>
<text x="34" y="457" font-size="15" font-weight="600" fill="#ced6dd" text-anchor="start" >Area elasticity</text>
<text x="34" y="475" font-size="13.5" font-weight="400" fill="#ced6dd" text-anchor="start" >(k<tspan dy="3.78" font-size="9.72">a</tspan><tspan dy="-3.78">/2)(A/A</tspan><tspan dy="3.78" font-size="9.72">0</tspan><tspan dy="-3.78"> − 1)</tspan><tspan dy="-5.13" font-size="9.72">2</tspan></text>
<text x="34" y="493" font-size="13.5" font-weight="400" fill="#ced6dd" text-anchor="start" >A<tspan dy="3.78" font-size="9.72">0</tspan><tspan dy="-3.78"> = (Q</tspan><tspan dy="3.78" font-size="9.72">0</tspan><tspan dy="-3.78"> V</tspan><tspan dy="-5.13" font-size="9.72">2</tspan><tspan dy="5.13">)</tspan><tspan dy="-5.13" font-size="9.72">1/3</tspan></text>
<text x="34" y="510" font-size="13" font-weight="400" fill="#a7b1bc" text-anchor="start" >acts along the same area gradient</text>
<text x="34" y="527" font-size="13" font-weight="400" fill="#a7b1bc" text-anchor="start" >as tension</text>
<circle cx="15" cy="552" r="10.5" fill="none" stroke="#ced6dd" stroke-width="1.4"/><text x="15" y="557" font-size="14" font-weight="700" fill="#ced6dd" text-anchor="middle" >4</text>
<text x="34" y="557" font-size="15" font-weight="600" fill="#ced6dd" text-anchor="start" >Bending</text>
<text x="34" y="575" font-size="13.5" font-weight="400" fill="#ced6dd" text-anchor="start" >(k<tspan dy="3.78" font-size="9.72">b</tspan><tspan dy="-3.78">/2) ∫ (2H)</tspan><tspan dy="-5.13" font-size="9.72">2</tspan><tspan dy="5.13"> dS, discrete hinges</tspan></text>
<text x="34" y="592" font-size="13" font-weight="400" fill="#a7b1bc" text-anchor="start" >across each edge shared by two faces;</text>
<text x="34" y="609" font-size="13" font-weight="400" fill="#a7b1bc" text-anchor="start" >force not an exact gradient</text>
<circle cx="15" cy="634" r="10.5" fill="none" stroke="#ced6dd" stroke-width="1.4"/><text x="15" y="639" font-size="14" font-weight="700" fill="#ced6dd" text-anchor="middle" >5</text>
<text x="34" y="639" font-size="15" font-weight="600" fill="#ced6dd" text-anchor="start" >Contact</text>
<text x="34" y="657" font-size="13.5" font-weight="400" fill="#ced6dd" text-anchor="start" >repulsion ξ·d where a node is inside</text>
<text x="34" y="675" font-size="13.5" font-weight="400" fill="#ced6dd" text-anchor="start" >a neighbour, within the contact range;</text>
<text x="34" y="693" font-size="13.5" font-weight="400" fill="#ced6dd" text-anchor="start" >adhesion</text>
<text x="34" y="710" font-size="13" font-weight="400" fill="#a7b1bc" text-anchor="start" >model 0: springs of strength ω;</text>
<text x="34" y="727" font-size="13" font-weight="400" fill="#a7b1bc" text-anchor="start" >models 1, 2: nodes tied together</text>
<text x="4" y="760" font-size="13" font-weight="400" fill="#a7b1bc" text-anchor="start" >Terms 1–4: Eq. (1) of Runser, Vetter &amp; Iber</text>
<text x="4" y="777" font-size="13" font-weight="400" fill="#a7b1bc" text-anchor="start" >(2024). Term 5: the contact model chosen</text>
<text x="4" y="794" font-size="13" font-weight="400" fill="#a7b1bc" text-anchor="start" >when the code is compiled.</text>
